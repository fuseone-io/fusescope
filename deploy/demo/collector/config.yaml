# Read by the fusescopeopamp provider: the fusescope_opamp section never
# reaches the collector, and the ingest policy changes who is accepted, never
# these listeners, pipelines or destinations.
fusescope_opamp:
  endpoint: wss://fusescope:4321/v1/opamp
  tls:
    min_version: "1.3"
    ca_file: /etc/fusescope-collector/ingest/ca.crt
  storage: /var/lib/fusescope-collector/opamp
  role: ingress
  auth:
    token_file: /etc/fusescope-collector/ingest/token

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # Browsers and apps, through Caddy (/rum/v1/traces and /rum/v1/logs).
  rum:
    endpoint: 0.0.0.0:4319
    tls:
      min_version: "1.3"
      cert_file: /etc/fusescope-collector/ingest/fusescope-collector.crt
      key_file: /etc/fusescope-collector/ingest/fusescope-collector.key
    ingest_policy: fusescope_opamp
    max_body_size: 4194304
    rate_limit:
      key: {rate: 500, burst: 1000}
      client: {rate: 20, burst: 60}
    # Caddy's X-Forwarded-For, from the compose networks.
    trusted_proxies: [172.16.0.0/12]
  host_metrics:
    collection_interval: 60s
    root_path: /hostfs
    scrapers:
      # Per logical CPU, and no logical count: the demo writes system.cpu.time
      # with a cpu label and no system.cpu.logical.count.
      cpu:
        metrics:
          system.cpu.time:
            attributes: [cpu, state]
          system.cpu.logical.count:
            enabled: false
      load: {}
      disk:
        exclude:
          devices: [sr0]
          match_type: strict
      filesystem: {}
      memory: {}

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  # FuseScope edits these two over OpAMP and never places them, so they are
  # declared and wired here.
  signozspanmapper: {groups: []}
  signozllmpricing:
    attrs:
      model: gen_ai.request.model
      in: gen_ai.usage.input_tokens
      out: gen_ai.usage.output_tokens
      cache_read: gen_ai.usage.cache_read.input_tokens
      cache_write: gen_ai.usage.cache_creation.input_tokens
    default_pricing:
      rules: []
    output_attrs:
      in: signoz.gen_ai.usage.input_tokens.cost
      out: signoz.gen_ai.usage.output_tokens.cost
      cache_read: signoz.gen_ai.usage.cache_read.input_tokens.cost
      cache_write: signoz.gen_ai.usage.cache_write.input_tokens.cost
      total: signoz.gen_ai.usage.tokens.cost
  resourcedetection/system:
    detectors: [system]
    system:
      hostname_sources: [os]

connectors:
  fusescope_spanmetrics:

exporters:
  fusescope_clickhouse:
    # By container name: with the shadow overlay, `clickhouse` is also an
    # alias of clickhouse-shadow on the shadow network.
    endpoint: fusescope-demo-clickhouse-1:9000
    tls:
      insecure: true
    # The service map joins parent and child spans only within one insert.
    sending_queue:
      batch:
        flush_timeout: 10s

extensions:
  fusescope_opamp: {}
  # The RUM receiver is a recoverable error until it holds an ingest policy.
  healthcheckv2:
    use_v2: true
    component_health:
      include_recoverable_errors: true
      recovery_duration: 0s
    http:
      endpoint: 0.0.0.0:13133
      status:
        enabled: true
        path: /health/status
      config:
        enabled: false

service:
  extensions: [healthcheckv2, fusescope_opamp]
  pipelines:
    traces:
      receivers: [otlp, rum]
      processors: [memory_limiter, signozspanmapper, signozllmpricing]
      exporters: [fusescope_clickhouse, fusescope_spanmetrics]
    logs:
      receivers: [otlp, rum]
      processors: [memory_limiter]
      exporters: [fusescope_clickhouse]
    metrics:
      receivers: [otlp, fusescope_spanmetrics]
      processors: [memory_limiter]
      exporters: [fusescope_clickhouse]
    metrics/host:
      receivers: [host_metrics]
      processors: [resourcedetection/system]
      exporters: [fusescope_clickhouse]
