##################### SigNoz Configuration Example #####################
#
# Do not modify this file
#

##################### Global #####################
global:
  # the url under which the signoz apiserver is externally reachable.
  # the path component (e.g. /signoz in https://example.com/signoz) is used
  # as the base path for all HTTP routes (both API and web frontend).
  external_url: <unset>
  # origins (scheme://host[:port], no path) allowed as login redirect targets. include
  # the origin the signoz ui is served on. when not configured, redirect targets are
  # not validated.
  # allowed_origins:
  #   - https://signoz.example.com
  # the url where the SigNoz backend receives telemetry data (traces, metrics, logs) from instrumented applications.
  # onboarding shows it as the OTLP/HTTP endpoint. an admin's url set from the ui overrides it; when both are unset,
  # onboarding derives <external_url host>:4317 (grpc) and http://<external_url host>:4318.
  ingestion_url: <unset>
  # the url of the SigNoz MCP server. when unset, the MCP settings page is hidden in the frontend.
  # mcp_url: <unset>
  # the url of the SigNoz AI Assistant server. when unset, the AI Assistant is hidden in the frontend.
  # ai_assistant_url: <unset>

##################### Version #####################
version:
  banner:
    # Whether to enable the version banner on startup.
    enabled: true

##################### Instrumentation #####################
instrumentation:
  logs:
    # The log level to use.
    level: info
  traces:
    # Whether to enable tracing.
    enabled: false
    processors:
      batch:
        exporter:
          otlp:
            endpoint: localhost:4317
  metrics:
    # Whether to enable metrics.
    enabled: true
    readers:
      pull:
        exporter:
          prometheus:
            host: "0.0.0.0"
            port: 9090

##################### PProf #####################
pprof:
  # Whether to enable the pprof server.
  enabled: true
  # The address on which the pprof server listens.
  address: 0.0.0.0:6060

##################### Web #####################
web:
  # Whether to enable the web frontend
  enabled: true
  # The index file to use as the SPA entrypoint.
  index: index.html
  # The directory containing the static build files.
  directory: /etc/signoz/web
  # Settings exposed to the web.
  settings:
    posthog:
      # Whether to enable PostHog in web.
      enabled: false
      # The PostHog project API key.
      key: ""
      # The PostHog API host. Defaults to https://us.i.posthog.com when empty.
      api_host: ""
      # The PostHog UI host. Used when api_host points at a reverse proxy.
      ui_host: ""
    appcues:
      # Whether to enable Appcues in web.
      enabled: false
      # The Appcues account/app ID.
      app_id: ""
    sentry:
      # Whether to enable Sentry in web.
      enabled: false
      # The Sentry DSN.
      dsn: ""
      # The Sentry tunnel URL.
      tunnel: ""
    pylon:
      # Whether to enable Pylon in web.
      enabled: false
      # The Pylon app ID.
      app_id: ""
      # The Pylon identity verification secret.
      identity_secret: ""

##################### Cache #####################
cache:
  # specifies the caching provider to use.
  provider: memory
  # memory: Uses in-memory caching.
  memory:
    # Max items for the in-memory cache (10x the entries)
    num_counters: 100000
    # Total cost in bytes allocated bounded cache
    max_cost: 67108864
  # redis: Uses Redis as the caching backend.
  redis:
    # The hostname or IP address of the Redis server.
    host: localhost
    # The port on which the Redis server is running. Default is usually 6379.
    port: 6379
    # The password for authenticating with the Redis server, if required.
    password:
    # The Redis database number to use
    db: 0

##################### SQLStore #####################
sqlstore:
  # specifies the SQLStore provider to use. Supported values: sqlite, postgres.
  provider: sqlite
  # The maximum number of open connections to the database.
  max_open_conns: 100
  # The maximum amount of time a connection may be reused.
  # If max_conn_lifetime == 0, connections are not closed due to a connection's age.
  max_conn_lifetime: 0
  sqlite:
    # The path to the SQLite database file.
    path: /var/lib/signoz/signoz.db
    # The journal mode for the sqlite database. Supported values: delete, wal.
    mode: wal
    # The timeout for the sqlite database to wait for a lock.
    busy_timeout: 10s
    # The default transaction locking behavior. Supported values: deferred, immediate, exclusive.
    transaction_mode: immediate
  postgres:
    # The PostgreSQL connection string, used when provider is postgres.
    # Example: postgres://user:password@host:5432/fusescope?sslmode=disable
    dsn: ""

##################### APIServer #####################
apiserver:
  # The TCP address the API server listens on, in the form "host:port".
  address: 0.0.0.0:8080
  # Maximum duration for reading an entire request, including the body.
  read_timeout: 60s
  # Keep at 0; any value cuts off streaming endpoints (livetail, SSE, export_raw_data).
  write_timeout: 0
  # tls:
  #   enabled: true
  #   cert_file: /path/to/server.crt
  #   key_file: /path/to/server.key
  #   # Minimum TLS version: "1.2" or "1.3". Defaults to "1.2".
  #   min_version: "1.2"
  timeout:
    # Default request timeout.
    default: 60s
    # Maximum request timeout.
    max: 600s
    # List of routes to exclude from request timeout.
    excluded_routes:
      - /api/v1/logs/tail
      - /api/v3/logs/livetail
  logging:
    # List of routes to exclude from request responselogging.
    excluded_routes:
      - /api/v1/health
      - /api/v1/version
      - /

##################### Querier #####################
querier:
  # The TTL for cached query results.
  cache_ttl: 168h
  # The interval for recent data that should not be cached.
  flux_interval: 5m
  # The maximum number of queries a single query range request runs at once.
  max_concurrent_queries: 8
  # When filtering logs by trace_id, clamp the query window to the trace time
  # range with padding to include slightly delayed log exports. Logs only; set
  # to 0 to disable.
  log_trace_id_window_padding: 5m

##################### TelemetryStore #####################
telemetrystore:
  # Maximum number of idle connections in the connection pool.
  max_idle_conns: 50
  # Maximum number of open connections to the database.
  max_open_conns: 100
  # Maximum time to wait for a connection to be established.
  dial_timeout: 5s
  # Specifies the telemetrystore provider to use.
  provider: clickhouse
  clickhouse:
    # The DSN to use for clickhouse.
    dsn: tcp://localhost:9000
    # The cluster name to use for clickhouse.
    cluster: cluster
    # The query settings for clickhouse.
    settings:
      max_execution_time: 0
      max_execution_time_leaf: 0
      timeout_before_checking_execution_speed: 0
      max_bytes_to_read: 0
      max_result_rows: 0
      ignore_data_skipping_indices: ""

##################### Prometheus #####################
prometheus:
  # The maximum time a PromQL query is allowed to run before being aborted.
  timeout: 2m
  active_query_tracker:
    # Whether to enable the active query tracker.
    enabled: true
    # The path to use for the active query tracker.
    path: ""
    # The maximum number of concurrent queries.
    max_concurrent: 20

##################### Alertmanager #####################
alertmanager:
  # Specifies the alertmanager provider to use.
  provider: signoz
  signoz:
    # The poll interval for periodically syncing the alertmanager with the config in the store.
    poll_interval: 1m
    # The URL under which Alertmanager is externally reachable (for example, if Alertmanager is served via a reverse proxy). Used for generating relative and absolute links back to Alertmanager itself.
    external_url: http://localhost:8080
    # The list of globs from which SigNoz's alertmanager notification templates are loaded (e.g. the email.signoz.html layout).
    # This mirrors the upstream alertmanager `templates` config option. The upstream default templates (default.tmpl, email.tmpl)
    # are always loaded from the embedded alertmanager assets, so only SigNoz's own templates need to be listed here.
    templates:
      - /opt/signoz/conf/templates/alertmanager/*.gotmpl
    # The global configuration for the alertmanager. All the exahustive fields can be found in the upstream: https://github.com/prometheus/alertmanager/blob/efa05feffd644ba4accb526e98a8c6545d26a783/config/config.go#L833
    global:
      # ResolveTimeout is the time after which an alert is declared resolved if it has not been updated.
      resolve_timeout: 5m
    route:
      # GroupByStr is the list of labels to group alerts by.
      group_by:
        - alertname
      # GroupInterval is the interval at which alerts are grouped.
      group_interval: 1m
      # GroupWait is the time to wait before sending alerts to receivers.
      group_wait: 1m
      # RepeatInterval is the interval at which alerts are repeated.
      repeat_interval: 1h
    alerts:
      # Interval between garbage collection of alerts.
      gc_interval: 30m
    silences:
      # Maximum number of silences, including expired silences. If negative or zero, no limit is set.
      max: 0
      # Maximum size of the silences in bytes. If negative or zero, no limit is set.
      max_size_bytes: 0
      # Interval between garbage collection and snapshotting of the silences. The snapshot will be stored in the state store.
      maintenance_interval: 15m
      # Retention of the silences.
      retention: 120h
    nflog:
      # Interval between garbage collection and snapshotting of the notification logs. The snapshot will be stored in the state store.
      maintenance_interval: 15m
      # Retention of the notification logs.
      retention: 120h

##################### Emailing #####################
emailing:
  # Whether to enable emailing.
  enabled: false
  templates:
    # The directory containing the email templates. This directory should contain a list of files defined at pkg/types/emailtypes/template.go.
    directory: /opt/signoz/conf/templates/email
    format:
      header:
        enabled: false
        logo_url: ""
      help:
        enabled: false
        email: ""
      footer:
        enabled: false
  smtp:
    # The SMTP server address.
    address: localhost:25
    # The email address to use for the SMTP server.
    from:
    # The hello message to use for the SMTP server.
    hello:
    # The static headers to send with the email.
    headers: {}
    auth:
      # The username to use for the SMTP server.
      username:
      # The password to use for the SMTP server.
      password:
      # The secret to use for the SMTP server.
      secret:
      # The identity to use for the SMTP server.
      identity:
    tls:
      # Whether to enable TLS. It should be false in most cases since the authentication mechanism should use the STARTTLS extension instead.
      enabled: false
      # Whether to skip TLS verification.
      insecure_skip_verify: false
      # The path to the CA file.
      ca_file_path:
      # The path to the key file.
      key_file_path:
      # The path to the certificate file.
      cert_file_path:

##################### Sharder (experimental) #####################
sharder:
  # Specifies the sharder provider to use.
  provider: noop
  single:
    # The org id to which this instance belongs to.
    org_id: org_id

##################### Analytics #####################
analytics:
  # Whether to enable analytics.
  enabled: false
  segment:
    # The key to use for segment.
    key: ""

##################### StatsReporter #####################
statsreporter:
  # Whether to enable the stats reporter. It only reports through the analytics provider, which is disabled by default.
  enabled: false
  # The interval at which the stats are collected.
  interval: 6h
  collect:
    # Whether to collect identities and traits (emails).
    identities: true

##################### Gateway (License only) #####################
gateway:
  # The URL of the gateway's api.
  url: http://localhost:8080

##################### Tokenizer #####################
tokenizer:
  # Specifies the tokenizer provider to use.
  provider: opaque
  lifetime:
    # The duration for which a user can be idle before being required to authenticate.
    idle: 168h
    # The duration for which a user can remain logged in before being asked to login.
    max: 720h
  rotation:
    # The interval to rotate tokens in.
    interval: 30m
    # The duration for which the previous token pair remains valid after a token pair is rotated.
    duration: 60s
  jwt:
    # The secret to sign the JWT tokens.
    secret: secret
  opaque:
    gc:
      # The interval to perform garbage collection.
      interval: 1h
    token:
      # The maximum number of tokens a user can have. This limits the number of concurrent sessions a user can have.
      max_per_user: 5

##################### Flagger #####################
flagger:
  # Config are the overrides for the feature flags which come directly from the config file.
  config:
    boolean:
      use_span_metrics: true
      kafka_span_eval: false
    string:
    float:
    integer:
    object:

##################### User #####################
user:
  password:
    reset:
      # Whether to allow users to reset their password themselves. Defaults to false.
      allow_self: false
      # The duration within which a user can reset their password.
      max_token_lifetime: 6h
    invite:
      # The duration within which a user can accept their invite.
      max_token_lifetime: 48h
  root:
    # Whether to enable the root user. When enabled, a root user is provisioned
    # on startup using the email and password below. The root user cannot be
    # deleted, updated, or have their password changed through the UI.
    enabled: false
    # The email address of the root user.
    email: ""
    # The password of the root user. Must meet password requirements.
    password: ""
    # The name of the organization to create or look up for the root user.
    org:
      name: default
      id: 00000000-0000-0000-0000-000000000000

##################### IdentN #####################
identn:
  tokenizer:
    # toggle tokenizer identN
    enabled: true
    # headers to use for tokenizer identN resolver
    headers:
      - Authorization
  apikey:
    # toggle apikey identN
    enabled: true
    # headers to use for apikey identN resolver
    headers:
      - SIGNOZ-API-KEY
  impersonation:
    # toggle impersonation identN, when enabled, all requests will impersonate the root user
    enabled: false

##################### Service Account #####################
serviceaccount:
  email:
    # email domain for the service account principal
    domain: signozserviceaccount.com

  analytics:
    # toggle service account analytics
    enabled: true

##################### Auth Domains (SSO) #####################
authdomain:
  # How often the domains below are re-applied. This also picks up the organization
  # created at first sign-up.
  reconcile_interval: 1m
  # SSO domains declared here are created or updated automatically, deleted when
  # removed from this list, and read-only in the UI and API. Domains created in the
  # UI are not affected. `config` and `role_mapping` use the same shape as the
  # /api/v2/auth_domains API; string values may reference environment variables
  # as ${NAME}.
  domains: []
  # domains:
  #   # Microsoft Entra ID
  #   - name: example.com
  #     # Organization id or name; may be omitted when there is a single organization.
  #     org: ""
  #     enabled: true
  #     config:
  #       kind: oidc
  #       spec:
  #         issuer: https://login.microsoftonline.com/<tenant-id>/v2.0
  #         clientId: <application-id>
  #         clientSecret: ${FUSESCOPE_ENTRA_CLIENT_SECRET}
  #     role_mapping:
  #       defaultRole: VIEWER
  #       groupMappings:
  #         <entra-group-object-id>: ADMIN
  #   # Keycloak
  #   - name: example.org
  #     config:
  #       kind: oidc
  #       spec:
  #         issuer: https://keycloak.example.org/realms/<realm>
  #         clientId: fusescope
  #         clientSecret: ${FUSESCOPE_KEYCLOAK_CLIENT_SECRET}
  #   # Okta: request the groups scope to receive the groups claim
  #   - name: example.net
  #     config:
  #       kind: oidc
  #       spec:
  #         issuer: https://<org>.okta.com
  #         clientId: <client-id>
  #         clientSecret: ${FUSESCOPE_OKTA_CLIENT_SECRET}
  #         scopes: [groups]

##################### Auditor #####################
auditor:
  # Specifies the auditor provider to use.
  # noop: discards all audit events (community default).
  # otlphttp: exports audit events via OTLP HTTP (enterprise).
  provider: noop
  # The async channel capacity for audit events. Events are dropped when full (fail-open).
  buffer_size: 1000
  # The maximum number of events per export batch.
  batch_size: 100
  # The maximum time between export flushes.
  flush_interval: 1s
  otlphttp:
    # The target scheme://host:port/path of the OTLP HTTP endpoint.
    endpoint: http://localhost:4318/v1/logs
    # Whether to use HTTP instead of HTTPS.
    insecure: false
    # The maximum duration for an export attempt.
    timeout: 10s
    # Additional HTTP headers sent with every export request.
    headers: {}
    retry:
      # Whether to retry on transient failures.
      enabled: true
      # The initial wait time before the first retry.
      initial_interval: 5s
      # The upper bound on backoff interval.
      max_interval: 30s
      # The total maximum time spent retrying.
      max_elapsed_time: 60s

##################### Cloud Integration #####################
cloudintegration:
  # cloud integration agent configuration
  agent:
    # The version of the cloud integration agent.
    version: v0.0.8

##################### Trace Detail #####################
traces:
  waterfall:
    # Number of spans returned per request when the trace is too large to show all at once.
    span_page_size: 500
    # Maximum depth of descendents to auto-expand for the selected span.
    max_depth_to_auto_expand: 5
    # Threshold below which all spans are returned without windowing.
    max_limit_to_select_all_spans: 10000
  flamegraph:
    # Maximum number of BFS depth levels included in a windowed response.
    max_selected_levels: 50
    # Maximum spans per level before sampling is applied.
    max_spans_per_level: 100
    # Number of highest-latency spans always included when sampling a level.
    sampling_top_latency_count: 5
    # Number of timestamp buckets used for uniform sampling within a level.
    sampling_bucket_count: 50
    # Threshold below which all spans are returned without windowing or sampling.
    select_all_spans_limit: 100000

##################### Authz #################################
authz:
  # Specifies the authz provider to use.
  provider: openfga
  openfga:
    # maximum tuples allowed per openfga write operation.
    max_tuples_per_write: 300

##################### Meter Reporter #####################
meterreporter:
  # The interval between collection ticks. Minimum 10m, maximum 24h.
  interval: 6h
  # Whether to backfill sealed days from the license creation day.
  backfill: true
  # Random jitter applied to the first collect and to every subsequent cycle.
  # The first collect fires at a random time in [0, jitter); each cycle then takes
  # interval - random(0, jitter). Must be between 10m and interval. Defaults to
  # min(interval, 2h) when unset.
  jitter: 2h

##################### RUM #####################
rum:
  # Serves the browser ingestion gateway under /rum/v1/{traces,logs}.
  enabled: true
  # Base URL of the collector OTLP/HTTP receiver; /v1/traces and /v1/logs are appended.
  collector_endpoint: http://localhost:4318
  # Timeout of one forward to the collector.
  forward_timeout: 10s
  # Largest accepted request body in bytes, before and after gzip decoding.
  max_body_size: 4194304
  # How long a key lookup, found or not, is cached. Revocations reach other instances within it.
  key_cache_ttl: 30s
  # How often key last-used and application first-seen times are written.
  usage_flush_interval: 1m
  ratelimit:
    # Token bucket shared by every client of one key.
    key:
      rate: 500
      burst: 1000
    # Token bucket per key and client IP. The IP is kept in memory only.
    client:
      rate: 20
      burst: 60
    # Use the first X-Forwarded-For address as the client IP. Enable only behind a proxy that sets it.
    trust_forwarded_for: false
  sourcemaps:
    # Directory the uploaded source maps are stored in; created on the first upload.
    dir: /var/lib/signoz/sourcemaps
    # Largest accepted map, in bytes.
    max_file_size: 52428800
    max_files_per_release: 1000
    # Bytes of maps one application holds.
    quota: 2147483648
    # Memory, in bytes, of the decoded maps kept for symbolication.
    cache_size: 268435456
    # Original source lines returned on each side of a symbolicated frame.
    context_lines: 5
    # How often the maps past their application's retention are deleted.
    cleanup_interval: 1h

##################### Dashboard #####################
dashboard:
  public:
    # In-memory, per-process limits on anonymous public dashboard requests.
    # The client IP follows rum.ratelimit.trust_forwarded_for.
    ratelimit:
      # Token bucket shared by every visitor of one public link.
      link:
        rate: 20
        burst: 200
      # Token bucket per client IP, across all public links. The IP is kept in memory only.
      client:
        rate: 5
        burst: 100

##################### Retention #####################
retention:
  # Retention, in days, set on every organization whose signal has no retention set
  # yet, through the same path as Settings > Retention. 0 keeps the schema default.
  # A retention set in the UI is never overridden. Like a change from the UI, the
  # ClickHouse TTL applies to new parts only; existing parts expire as they merge.
  default:
    logs: 0
    traces: 0
    metrics: 0
  # How often organizations are checked for an unset retention. This also picks up
  # the organization created at first sign-up.
  reconcile_interval: 1m

##################### Archive #####################
# Long-term archive of telemetry to object storage, as Parquet (docs/adr/0002).
archive:
  # How often the export cycle runs.
  interval: 1h
  # Applied to every export and restore query.
  limits:
    # Archive queries running at once, across the cycle.
    concurrency: 1
    # Per query, in bytes. 0 leaves the server default.
    max_memory_usage: 2147483648
    # Per query; also max_insert_threads on restore.
    max_threads: 4
    row_group_rows: 100000
  # Superseded objects are deleted after this many days, except on Object Lock
  # buckets. 0 keeps them.
  gc_superseded_days: 30
  logs:
    enabled: false
    # ClickHouse named collection holding the bucket endpoint and credentials.
    named_collection: ""
    # Object key prefix: /-separated segments of A-Z, a-z, 0-9, '.', '_', '=' and '-'.
    prefix: ""
    # Days past retention that unarchived data is kept, counted from ingestion.
    # 2–30, and at least twice the interval.
    backstop_days: 7
    # Parts landing in an archived partition are exported once they total
    # late_min_rows, or late_max_hold after first seen (below half the backstop).
    late_min_rows: 1000000
    late_max_hold: 24h
    compaction:
      enabled: true
      # A partition is compacted when it has more objects than min_objects, or a
      # mean object size below min_bytes.
      min_objects: 16
      min_bytes: 67108864
