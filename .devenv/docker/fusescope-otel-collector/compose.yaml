services:
  fusescope-otel-collector:
    image: ghcr.io/fuseone-io/fusescope-otel-collector:0.145.0
    container_name: fusescope-otel-collector-dev
    entrypoint:
      - /bin/sh
    # Runs the fork's own migrator first, on the ClickHouse of
    # `make devenv-clickhouse-fork`: never on one fusescope-schema migrated,
    # which no longer supports the fork's migrator after its 0002.
    command:
      - -c
      - |
        /fusescope-otel-collector migrate bootstrap &&
        /fusescope-otel-collector migrate sync up &&
        /fusescope-otel-collector migrate async up &&
        /fusescope-otel-collector --config=/etc/otel-collector-config.yaml
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=host.name=signoz-host,os.type=linux
      - LOW_CARDINAL_EXCEPTION_GROUPING=false
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://clickhouse:9000
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER=cluster
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION=true
      - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "13133:13133" # health check extension
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The fork's migrator connects to the hosts ClickHouse lists for the
    # cluster, which resolve on devenv-clickhouse-fork's own network.
    networks:
      - default
      - signoz-devenv
      - clickhouse-fork

networks:
  signoz-devenv:
    name: signoz-devenv
  clickhouse-fork:
    name: clickhouse-fork_default
    external: true
