services:
  fusescope-otel-collector:
    image: ghcr.io/fuseone-io/fusescope-otel-collector:0.145.0
    container_name: fusescope-otel-collector-dev
    entrypoint:
      - /bin/sh
    command:
      - -c
      - |
        /fusescope-otel-collector migrate sync check &&
        /fusescope-otel-collector --config=/etc/otel-collector-config.yaml
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=host.name=signoz-host,os.type=linux
      - LOW_CARDINAL_EXCEPTION_GROUPING=false
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://clickhouse:9000
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER=cluster
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION=true
      - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m
    # Internal only (fuseone-io/fusescope#225): it migrates the schema, and
    # fusescope-collector receives OTLP on the host's 4317 and 4318.
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - signoz-devenv

networks:
  signoz-devenv:
    name: signoz-devenv
