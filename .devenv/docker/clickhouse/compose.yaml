services:
  init-clickhouse:
    image: clickhouse/clickhouse-server:25.12.5
    container_name: init-clickhouse
    command:
      - bash
      - -c
      - |
        version="v0.0.1"
        node_os=$$(uname -s | tr '[:upper:]' '[:lower:]')
        node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
        echo "Fetching histogram-binary for $${node_os}/$${node_arch}"
        cd /tmp
        wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F$${version}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz"
        tar -xvzf histogram-quantile.tar.gz
        mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
    restart: on-failure
    volumes:
      - clickhouse-user-scripts:/var/lib/clickhouse/user_scripts/
  clickhouse:
    image: clickhouse/clickhouse-server:25.12.5
    container_name: clickhouse
    volumes:
      - ./fs/etc/clickhouse-server/config.d/config.xml:/etc/clickhouse-server/config.d/config.xml
      - ./fs/etc/clickhouse-server/config.d/system-logs.xml:/etc/clickhouse-server/config.d/system-logs.xml
      - ./fs/etc/clickhouse-server/users.d/users.xml:/etc/clickhouse-server/users.d/users.xml
      - clickhouse-data:/var/lib/clickhouse/
      - clickhouse-user-scripts:/var/lib/clickhouse/user_scripts/
      - ./fs/etc/clickhouse-server/custom-function.xml:/etc/clickhouse-server/custom-function.xml
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    tty: true
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - 0.0.0.0:8123/ping
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      init-clickhouse:
        condition: service_completed_successfully
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    networks:
      - default
      - signoz-devenv
  telemetrystore-migrator:
    # fusescope-schema, shipped in the FuseScope collector image. Exit 2
    # (ClickHouse not ready) is retryable, hence restart: on-failure.
    image: ${FUSESCOPE_SCHEMA_IMAGE:-ghcr.io/fuseone-io/fusescope-collector:0.4.1@sha256:9951f2479ac6e5150b116cd856569aaae6ed921e9b951f0fd9c93160e7311077}
    container_name: telemetrystore-migrator
    entrypoint: ["/fusescope-schema"]
    command: ["migrate", "--endpoint=clickhouse:9000", "--username=default", "--tls-insecure", "--cluster=cluster"]
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: on-failure
    networks:
      - default
      - signoz-devenv

networks:
  signoz-devenv:
    name: signoz-devenv

volumes:
  clickhouse-data:
  clickhouse-user-scripts:
