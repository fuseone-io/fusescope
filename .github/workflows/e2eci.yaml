name: e2eci

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/adr/**"
      - "docs/brand/**"
      - "docs/contributing/**"
      - "docs/img/**"
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  pull_request_target:
    paths-ignore:
      - "**/*.md"
      - "docs/adr/**"
      - "docs/brand/**"
      - "docs/contributing/**"
      - "docs/img/**"
    types:
      - labeled
  merge_group:
    types:
      - checks_requested

concurrency:
  group: e2eci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}${{ (github.event.action == 'labeled' && github.event.label.name != 'safe-to-e2e' && github.event.label.name != 'safe-to-test') && format('-ignored-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name != 'merge_group' && !(github.event.action == 'labeled' && github.event.label.name != 'safe-to-e2e' && github.event.label.name != 'safe-to-test')
    runs-on: ubuntu-24.04
    outputs:
      e2e: ${{ steps.changes.outputs.e2e }}
    steps:
      - name: changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'safe-to-e2e') }}
        run: |
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
          if [ "$LABELED" = true ] || grep -qE '^(frontend|tests/e2e)/' <<< "$files"; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          fi
  fmtlint:
    needs: changes
    if: |
      ((github.event_name == 'pull_request' && ! github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]' && ! contains(github.event.pull_request.labels.*.name, 'safe-to-test')) ||
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe-to-test'))) && needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: install-pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: install
        run: |
          cd tests/e2e && pnpm install
      - name: fmt
        run: |
          cd tests/e2e && pnpm fmt:check
      - name: lint
        run: |
          cd tests/e2e && pnpm lint
  # Shares the image as an artifact, not via a registry: pull_request_target
  # runs fork code and must not hold a write token.
  build:
    needs: changes
    if: |
      ((github.event_name == 'pull_request' && ! github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]' && ! contains(github.event.pull_request.labels.*.name, 'safe-to-test')) ||
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe-to-test'))) && needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v7
      # Restore-only: the cacheci workflow owns cache saves. Seeds the
      # BuildKit cache mounts so the image build is incremental.
      - name: restore
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/cacheci
          key: tests-primary
          restore-keys: |
            tests-secondary
      - name: inject
        if: steps.restore.outputs.cache-matched-key != ''
        run: |
          cat > "$RUNNER_TEMP/inject.Dockerfile" <<'EOF'
          FROM busybox:1.37
          RUN --mount=type=cache,target=/root/.cache/go-build \
              --mount=type=cache,target=/go/pkg/mod \
              --mount=type=cache,target=/pnpm/store \
              --mount=type=bind,target=/restored \
              tar -xf /restored/go-build.tar -C /root/.cache/go-build && \
              tar -xf /restored/go-mod.tar -C /go/pkg/mod && \
              tar -xf /restored/pnpm-store.tar -C /pnpm/store
          EOF
          docker build -f "$RUNNER_TEMP/inject.Dockerfile" "$RUNNER_TEMP/cacheci"
      - name: build
        run: |
          docker build \
            --file cmd/community/Dockerfile.with-web.integration \
            --tag fusescope-ci:with-web \
            --build-arg TARGETARCH=amd64 \
            .
      - name: save
        run: |
          docker save fusescope-ci:with-web | zstd -T0 -o "$RUNNER_TEMP/image.tar.zst"
          ls -lh "$RUNNER_TEMP/image.tar.zst"
      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: image
          path: ${{ runner.temp }}/image.tar.zst
          compression-level: 0
          retention-days: 1
  test:
    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium
        shard: [1, 2, 3, 4]
    needs: [changes, build]
    if: |
      ((github.event_name == 'pull_request' && ! github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]' && ! contains(github.event.pull_request.labels.*.name, 'safe-to-test')) ||
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe-to-test'))) && needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v7
      # Images bring-up-stack would otherwise pull, at the tests/conftest.py
      # defaults. A stale tag only loses the head start.
      - name: pull-images
        id: pull-images
        background: true
        run: |
          printf '%s\n' \
            python:3.13-slim \
            postgres:15 \
            clickhouse/clickhouse-server:25.12.5 \
            clickhouse/clickhouse-keeper:25.12.5 \
            ghcr.io/fuseone-io/fusescope-schema-migrator:0.145.0 \
            wiremock/wiremock:2.35.1-1 \
            | xargs -P 0 -n 1 docker pull -q
      - name: download-image
        uses: actions/download-artifact@v8
        with:
          name: image
          path: ${{ runner.temp }}
      - name: load-image
        id: load-image
        background: true
        run: |
          zstd -dc "$RUNNER_TEMP/image.tar.zst" | docker load
          rm "$RUNNER_TEMP/image.tar.zst"
      - name: python
        uses: actions/setup-python@v7
        with:
          python-version: 3.13
      - name: uv
        uses: astral-sh/setup-uv@v10.3.0
      - name: python-install
        id: python-install
        background: true
        run: |
          cd tests && uv sync
      - name: node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: install-pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: pnpm-install
        run: |
          cd tests/e2e && pnpm install --frozen-lockfile
      - name: wait-stack-deps
        wait: [pull-images, load-image, python-install]
      # Started after the pulls so its download does not compete with them
      # for the network.
      - name: playwright-browsers
        id: playwright-browsers
        background: true
        run: |
          docker create --name pw mcr.microsoft.com/playwright:v1.57.0-noble
          docker cp pw:/ms-playwright "$RUNNER_TEMP/ms-playwright"
          docker rm pw
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
          cd tests/e2e && pnpm playwright install-deps ${{ matrix.project }}
      - name: bring-up-stack
        run: |
          cd tests && \
            uv run pytest \
            --basetemp=./tmp/ \
            -vv --reuse --with-web \
            --signoz-image fusescope-ci:with-web \
            e2e/bootstrap/setup.py::test_setup
      - name: wait-playwright-browsers
        wait: playwright-browsers
      - name: playwright-test
        run: |
          cd tests/e2e && \
            pnpm playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/4
      - name: teardown-stack
        if: always()
        run: |
          cd tests && \
            uv run pytest \
            --basetemp=./tmp/ \
            -vv --teardown \
            e2e/bootstrap/setup.py::test_teardown
      - name: upload-artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts-${{ matrix.project }}-${{ matrix.shard }}
          path: tests/e2e/artifacts/
          retention-days: 5
  # Required status check. Fails when e2e was needed but did not pass,
  # including fork and dependabot PRs still waiting on safe-to-test.
  # Skipped on runs superseded or ignored by the concurrency group, so they
  # don't shadow the run that decides.
  e2e:
    if: |
      !cancelled() &&
      !(github.event.action == 'labeled' && github.event.label.name != 'safe-to-e2e' && github.event.label.name != 'safe-to-test')
    needs: [changes, fmtlint, test]
    runs-on: ubuntu-24.04
    steps:
      - name: verdict
        if: |
          github.event_name != 'merge_group' &&
          !(github.event_name == 'pull_request_target' && ! github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]') &&
          (needs.changes.result != 'success' ||
          (needs.changes.outputs.e2e == 'true' && (needs.fmtlint.result != 'success' || needs.test.result != 'success')))
        run: |
          echo "::error::e2e did not pass. Fork and dependabot PRs need the safe-to-test label."
          exit 1
