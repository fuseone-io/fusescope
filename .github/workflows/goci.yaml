name: goci

on:
  pull_request:
    branches:
      - main
  pull_request_target:
    types:
      - labeled
  merge_group:
    types:
      - checks_requested

jobs:
  # The gate. Its code comes from the base commit, or from the head of a pull
  # request from this repository, never from a fork or dependabot head.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      go: ${{ steps.changes.outputs.go }}
      sha: ${{ steps.authorize.outputs.sha }}
      ignored: ${{ steps.authorize.outputs.ignored }}
      run: ${{ steps.authorize.outputs.run }}
      pass: ${{ steps.authorize.outputs.pass }}
      reason: ${{ steps.authorize.outputs.reason }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.sha || github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: changes
        id: changes
        uses: ./.github/actions/changes
      - name: authorize
        id: authorize
        uses: ./.github/actions/authorize
        with:
          relevant: ${{ steps.changes.outputs.go }}
          triggers: safe-to-test
          untrusted-requires: safe-to-test
  test:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    # Go tests that must hold on PostgreSQL as on SQLite run against this
    # database; without FUSESCOPE_TEST_POSTGRES_DSN they skip.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: fusescope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      FUSESCOPE_TEST_POSTGRES_DSN: postgres://postgres:test@localhost:5432/fusescope_test?sslmode=disable
    steps:
      - name: self-checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}
          persist-credentials: false
      - name: go-install
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: test
        run: go test ./...
  fmt:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: self-checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}
          persist-credentials: false
      - name: go-install
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          files=$(gofmt -l $(git ls-files '*.go'))
          test -z "$files" || (echo "$files"; exit 1)
  lint:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: self-checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}
          persist-credentials: false
      - name: go-install
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout=15m
  deps:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: self-checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}
          persist-credentials: false
      - name: go-install
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go-mod-tidy
        run: |
          go mod tidy
          git diff --compact-summary --exit-code || (echo; echo "go.mod/go.sum are not tidy. Run go mod tidy locally and commit."; exit 1)
  semconv-generated:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: self-checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}
          persist-credentials: false
      - name: go-install
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: check-semconv-generated-files
        run: make semconv-check
  logspipeline-compat:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: self-checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}
          persist-credentials: false
      - name: go-install
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The collector's log pipelines library in this module's graph, its
      # replace directives included (collector ADR 0012, decision 4).
      - name: check-logspipeline-in-this-graph
        run: make logspipeline-compat
  agpl-guard:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: self-checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}
          persist-credentials: false
      - name: go-install
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: charts-checkout
        uses: actions/checkout@v7
        with:
          repository: fuseone-io/fusescope-charts
          ref: main
          path: fusescope-charts
          persist-credentials: false
      # helm comes with the ubuntu-24.04 runner image. The guard builds charts/fusescope's own
      # dependencies; the clickhouse subchart's, zookeeper, is built first so every image the
      # default install runs is rendered, as in fusescope-charts' agpl-guard workflow.
      - name: charts-subchart-dependencies
        run: |
          helm dependency build fusescope-charts/charts/zookeeper
          helm dependency build fusescope-charts/charts/clickhouse
      - name: check-agpl-collector-packages-and-default-install-images
        run: make agpl-check AGPL_CHART=fusescope-charts/charts/fusescope
  build:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: self-checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}
          persist-credentials: false
      - name: go-install
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: qemu-install
        uses: docker/setup-qemu-action@v4
      - name: aarch64-install
        run: |
          set -ex
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools
      - name: node-install
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: setup-pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: docker-community
        shell: bash
        run: |
          make docker-build-community
  openapi:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: self-checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}
          persist-credentials: false
      - name: go-install
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: generate-openapi
        run: |
          go run ./cmd/community generate openapi
          git diff --compact-summary --exit-code || (echo; echo "Unexpected difference in openapi spec. Run go run ./cmd/community generate openapi locally and commit."; exit 1)
  authz:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: self-checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}
          persist-credentials: false
      - name: go-install
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: generate-authz
        run: |
          go run ./cmd/community generate authz
          git diff --compact-summary --exit-code || (echo; echo "Unexpected difference in authz permissions. Run go run ./cmd/community generate authz locally and commit."; exit 1)
  web-settings:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: self-checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}
          persist-credentials: false
      - name: go-install
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: generate-web-settings
        run: |
          go run ./cmd/community generate config web-settings
          git diff --compact-summary --exit-code || (echo; echo "Unexpected difference in web settings schema. Run go run ./cmd/community generate config web-settings locally and commit."; exit 1)
  transaction-groups:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: self-checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}
          persist-credentials: false
      - name: go-install
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: generate-transaction-groups
        run: |
          go run ./cmd/community generate config transaction-groups
          git diff --compact-summary --exit-code || (echo; echo "Unexpected difference in transaction groups schema. Run go run ./cmd/community generate config transaction-groups locally and commit."; exit 1)
  # Required status check. Always runs, so the check exists on every head.
  # Runs that do not decide the verdict report as "goci (ignored)", a name
  # the required check does not match. Fails when a Go job was needed but did
  # not pass, including when a safe-to-* label is missing for this head.
  goci:
    name: ${{ needs.changes.outputs.ignored == 'true' && 'goci (ignored)' || 'goci' }}
    if: always()
    needs: [changes, test, fmt, lint, deps, semconv-generated, logspipeline-compat, agpl-guard, build, openapi, authz, web-settings, transaction-groups]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: verdict
        env:
          GATE: ${{ needs.changes.result }}
          IGNORED: ${{ needs.changes.outputs.ignored }}
          RUN: ${{ needs.changes.outputs.run }}
          PASS: ${{ needs.changes.outputs.pass }}
          REASON: ${{ needs.changes.outputs.reason }}
          SHA: ${{ needs.changes.outputs.sha }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "sha: $SHA"
          if [ "$IGNORED" = true ]; then echo "this run does not decide: $REASON"; exit 0; fi
          if [ "$GATE" != success ]; then echo "::error::the gate did not decide ($GATE)"; exit 1; fi
          if [ "$PASS" = true ]; then echo "passes: $REASON"; exit 0; fi
          if [ "$RUN" != true ]; then echo "::error::goci did not run: $REASON"; exit 1; fi
          failed=$(jq -r 'to_entries[] | select(.key != "changes" and .value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"' <<<"$NEEDS")
          if [ -n "$failed" ]; then echo "::error::goci did not pass: $failed"; exit 1; fi
          echo "passed: $REASON"
