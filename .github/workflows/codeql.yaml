name: codeql

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/adr/**"
      - "docs/brand/**"
      - "docs/contributing/**"
      - "docs/img/**"
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: self-checkout
        uses: actions/checkout@v7
      - name: go-install
        if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: codeql-init
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: go-build
        if: matrix.language == 'go'
        run: go build ./...
      - name: codeql-analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
