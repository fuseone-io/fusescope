name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/fusescope

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: build frontend
        run: make js-build
      - name: build backend
        run: CGO_ENABLED=0 make go-build-community VERSION=${{ github.ref_name }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: cmd/community/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  sign:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      packages: write
      attestations: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v4
      # --recursive also signs each platform manifest, which is what a pull resolves to.
      - name: sign image
        run: cosign sign --yes --recursive "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  sbom:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    steps:
      - uses: anchore/sbom-action@v0
        env:
          SYFT_PLATFORM: linux/amd64
        with:
          image: ${{ env.IMAGE }}@${{ needs.image.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: fusescope-linux-amd64.spdx.json
          artifact-name: fusescope-linux-amd64.spdx.json
          upload-artifact: ${{ github.ref_type != 'tag' }}
          upload-release-assets: false
      - uses: anchore/sbom-action@v0
        env:
          SYFT_PLATFORM: linux/arm64
        with:
          image: ${{ env.IMAGE }}@${{ needs.image.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: fusescope-linux-arm64.spdx.json
          artifact-name: fusescope-linux-arm64.spdx.json
          upload-artifact: ${{ github.ref_type != 'tag' }}
          upload-release-assets: false
      - name: attach to release
        if: github.ref_type == 'tag'
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes
          gh release upload "$TAG" fusescope-linux-*.spdx.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
