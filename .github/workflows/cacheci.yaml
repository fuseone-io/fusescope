name: cacheci

on:
  push:
    branches:
      - main
    paths:
      - go.mod
      - go.sum
      - frontend/pnpm-lock.yaml
      - cmd/community/Dockerfile.integration
      - cmd/community/Dockerfile.with-web.integration
      - .github/workflows/cacheci.yaml
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

concurrency:
  group: cacheci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  save:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: build
        run: |
          for dockerfile in Dockerfile.integration Dockerfile.with-web.integration; do
            docker build --file "cmd/community/$dockerfile" --build-arg TARGETARCH=amd64 .
          done
      # Mirror of the inject step in integrationci and e2eci.
      - name: extract
        run: |
          docker build --no-cache --output type=local,dest="$RUNNER_TEMP/cacheci" - <<'EOF'
          FROM busybox:1.37 AS extract
          RUN --mount=type=cache,target=/root/.cache/go-build \
              --mount=type=cache,target=/go/pkg/mod \
              --mount=type=cache,target=/pnpm/store \
              mkdir /out && \
              tar -cf /out/go-build.tar -C /root/.cache/go-build . && \
              tar -cf /out/go-mod.tar -C /go/pkg/mod . && \
              tar -cf /out/pnpm-store.tar -C /pnpm/store .
          FROM scratch
          COPY --from=extract /out/ /
          EOF
          ls -lh "$RUNNER_TEMP/cacheci"
      - name: delete
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache delete tests-primary --repo "$GITHUB_REPOSITORY" || true
      - name: save
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/cacheci
          key: tests-primary
