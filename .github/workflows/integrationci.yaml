name: integrationci

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/adr/**"
      - "docs/brand/**"
      - "docs/contributing/**"
      - "docs/img/**"
    types:
      - labeled
  pull_request_target:
    paths-ignore:
      - "**/*.md"
      - "docs/adr/**"
      - "docs/brand/**"
      - "docs/contributing/**"
      - "docs/img/**"
    types:
      - labeled
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: integrationci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}${{ (github.event.action == 'labeled' && github.event.label.name != 'safe-to-integrate' && github.event.label.name != 'safe-to-test') && format('-ignored-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  changes:
    if: |
      !(github.event.action == 'labeled' && github.event.label.name != 'safe-to-integrate' && github.event.label.name != 'safe-to-test') && (
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      ((github.event_name == 'pull_request' && ! github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]' && ! contains(github.event.pull_request.labels.*.name, 'safe-to-test')) ||
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe-to-test'))) && contains(github.event.pull_request.labels.*.name, 'safe-to-integrate')
      )
    runs-on: ubuntu-24.04
    outputs:
      integration: ${{ steps.changes.outputs.integration }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: changes
        id: changes
        uses: ./.github/actions/changes
  fmtlint:
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}
          persist-credentials: false
      - name: python
        uses: actions/setup-python@v7
        with:
          python-version: 3.13
      - name: uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: install
        run: |
          cd tests && uv sync
      - name: fmt
        run: |
          make py-fmt
          git diff --exit-code -- tests/
      - name: lint
        run: |
          make py-lint
  # Shares the image as an artifact, not via a registry: pull_request_target
  # runs fork code and must not hold a write token.
  build:
    needs: changes
    if: needs.changes.outputs.integration != ''
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}
          persist-credentials: false
      # Restore-only: the cacheci workflow owns cache saves. Seeds the
      # BuildKit cache mounts so the image build is incremental.
      - name: restore
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/cacheci
          key: tests-primary
          restore-keys: |
            tests-secondary
      - name: inject
        if: steps.restore.outputs.cache-matched-key != ''
        run: |
          cat > "$RUNNER_TEMP/inject.Dockerfile" <<'EOF'
          FROM busybox:1.37
          RUN --mount=type=cache,target=/root/.cache/go-build \
              --mount=type=cache,target=/go/pkg/mod \
              --mount=type=cache,target=/pnpm/store \
              --mount=type=bind,target=/restored \
              tar -xf /restored/go-build.tar -C /root/.cache/go-build && \
              tar -xf /restored/go-mod.tar -C /go/pkg/mod && \
              tar -xf /restored/pnpm-store.tar -C /pnpm/store
          EOF
          docker build -f "$RUNNER_TEMP/inject.Dockerfile" "$RUNNER_TEMP/cacheci"
          rm -rf "$RUNNER_TEMP/cacheci"
      - name: build
        run: |
          docker build \
            --file cmd/community/Dockerfile.integration \
            --tag fusescope-ci:integration \
            --build-arg TARGETARCH=amd64 \
            .
      - name: save
        run: |
          docker save fusescope-ci:integration | zstd -T0 -o "$RUNNER_TEMP/image.tar.zst"
          ls -lh "$RUNNER_TEMP/image.tar.zst"
      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: image
          path: ${{ runner.temp }}/image.tar.zst
          compression-level: 0
          retention-days: 1
  groups:
    needs: changes
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}
          persist-credentials: false
      - name: matrix
        id: matrix
        env:
          SELECTION: ${{ needs.changes.outputs.integration }}
        run: |
          echo "matrix=$(python3 tests/integration/groups.py "$SELECTION")" >> "$GITHUB_OUTPUT"
  test:
    name: test (${{ matrix.group.name }}, ${{ matrix.sqlstore-provider }}, ${{ matrix.schema-migrator }})
    needs: [build, groups]
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.groups.outputs.matrix) }}
        sqlstore-provider:
          - sqlite
          - postgres
        sqlite-mode:
          - wal
        clickhouse-version:
          - 25.12.5
        # fusescope-schema by default; the fork's migrator stays on one SQL
        # store until both variants pass.
        schema-migrator:
          - fusescope
          - fork
        fusescope-schema-version:
          - 0.4.0@sha256:a1e2fcd7248035b231e8d4c9c3234d617b983296464d31834fdabc1184fa24a1
        schema-migrator-version:
          - 0.145.0
        postgres-version:
          - 15
        exclude:
          - schema-migrator: fork
            sqlstore-provider: sqlite
    if: needs.groups.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}
          persist-credentials: false
      - name: python
        uses: actions/setup-python@v7
        with:
          python-version: 3.13
      - name: uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: install
        run: |
          cd tests && uv sync
      - name: webdriver
        if: matrix.group.webdriver
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee -a /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -qqy
          sudo apt-get -qqy install google-chrome-stable
          CHROME_VERSION=$(google-chrome-stable --version)
          CHROME_FULL_VERSION=${CHROME_VERSION%%.*}
          CHROME_MAJOR_VERSION=${CHROME_FULL_VERSION//[!0-9]}
          sudo rm /etc/apt/sources.list.d/google-chrome.list
          export CHROMEDRIVER_VERSION=`curl -s https://googlechromelabs.github.io/chrome-for-testing/LATEST_RELEASE_${CHROME_MAJOR_VERSION%%.*}`
          curl -L -O "https://storage.googleapis.com/chrome-for-testing-public/${CHROMEDRIVER_VERSION}/linux64/chromedriver-linux64.zip"
          unzip chromedriver-linux64.zip
          chmod +x chromedriver-linux64/chromedriver
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/chromedriver
          chromedriver -version
          google-chrome-stable --version
      - name: disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: load
        uses: actions/download-artifact@v8
        with:
          name: image
          path: ${{ runner.temp }}
      - name: docker-load
        run: |
          zstd -dc "$RUNNER_TEMP/image.tar.zst" | docker load
          rm "$RUNNER_TEMP/image.tar.zst"
      - name: run
        env:
          RUNS: ${{ matrix.group.runs }}
        run: |
          cd tests
          status=0
          while read -ra suites; do
            echo "pytest: ${suites[*]}"
            uv run pytest \
              --basetemp=./tmp/ \
              "${suites[@]/#/integration/tests/}" \
              --sqlstore-provider ${{matrix.sqlstore-provider}} \
              --sqlite-mode ${{matrix.sqlite-mode}} \
              --postgres-version ${{matrix.postgres-version}} \
              --clickhouse-version ${{matrix.clickhouse-version}} \
              --schema-migrator ${{matrix.schema-migrator}} \
              --fusescope-schema-version ${{matrix.fusescope-schema-version}} \
              --schema-migrator-version ${{matrix.schema-migrator-version}} \
              --signoz-image fusescope-ci:integration \
              || { status=1; echo "::error title=integration failed::${suites[*]}"; }
          done <<< "$RUNS"
          exit $status
