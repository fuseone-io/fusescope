name: integrationci

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/adr/**"
      - "docs/brand/**"
      - "docs/contributing/**"
      - "docs/img/**"
    types:
      - labeled
  pull_request_target:
    paths-ignore:
      - "**/*.md"
      - "docs/adr/**"
      - "docs/brand/**"
      - "docs/contributing/**"
      - "docs/img/**"
    types:
      - labeled
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: integrationci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fmtlint:
    if: |
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      ((github.event_name == 'pull_request' && ! github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]' && ! contains(github.event.pull_request.labels.*.name, 'safe-to-test')) ||
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe-to-test'))) && contains(github.event.pull_request.labels.*.name, 'safe-to-integrate')
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: python
        uses: actions/setup-python@v7
        with:
          python-version: 3.13
      - name: uv
        uses: astral-sh/setup-uv@v10.3.0
      - name: install
        run: |
          cd tests && uv sync
      - name: fmt
        run: |
          make py-fmt
          git diff --exit-code -- tests/
      - name: lint
        run: |
          make py-lint
  test:
    strategy:
      fail-fast: false
      matrix:
        suite:
          - alertmanager
          - alertmanagerrotation
          - auditquerier
          - basepath
          - authdomainconfig
          - callbackauthn
          - cloudintegrations
          - dashboard
          - ingestionkeys
          - integrations
          - inframonitoring
          - llmpricingrules
          - logspipelines
          - onboarding
          - passwordauthn
          - preference
          - quickfilter
          - querierlogs
          - queriertraces
          - queriermetrics
          - querierscalar
          - queriercommon
          - querierai
          - rawexportdata
          - promqlconformance
          - promapiconformance
          - promote
          - querierauthz
          - role
          - rootuser
          - rum
          - ruler
          - savedview
          - schemacontract
          - semconvfamilies
          - serviceaccount
          - simulatorcontract
          - spanmapper
          - tracedetail
          - thirdpartyapi
          - querier_json_body
          - querier_skip_resource_fingerprint
          - ttl
          - clickhousecluster
          - metricreduction
        sqlstore-provider:
          - sqlite
          - postgres
        sqlite-mode:
          - wal
        clickhouse-version:
          - 25.12.5
        schema-migrator-version:
          - 0.145.0
        postgres-version:
          - 15
    if: |
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      ((github.event_name == 'pull_request' && ! github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]' && ! contains(github.event.pull_request.labels.*.name, 'safe-to-test')) ||
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe-to-test'))) && contains(github.event.pull_request.labels.*.name, 'safe-to-integrate')
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: python
        uses: actions/setup-python@v7
        with:
          python-version: 3.13
      - name: uv
        uses: astral-sh/setup-uv@v10.3.0
      - name: install
        run: |
          cd tests && uv sync
      - name: webdriver
        if: matrix.suite == 'callbackauthn' || matrix.suite == 'basepath'
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee -a /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -qqy
          sudo apt-get -qqy install google-chrome-stable
          CHROME_VERSION=$(google-chrome-stable --version)
          CHROME_FULL_VERSION=${CHROME_VERSION%%.*}
          CHROME_MAJOR_VERSION=${CHROME_FULL_VERSION//[!0-9]}
          sudo rm /etc/apt/sources.list.d/google-chrome.list
          export CHROMEDRIVER_VERSION=`curl -s https://googlechromelabs.github.io/chrome-for-testing/LATEST_RELEASE_${CHROME_MAJOR_VERSION%%.*}`
          curl -L -O "https://storage.googleapis.com/chrome-for-testing-public/${CHROMEDRIVER_VERSION}/linux64/chromedriver-linux64.zip"
          unzip chromedriver-linux64.zip
          chmod +x chromedriver-linux64/chromedriver
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/chromedriver
          chromedriver -version
          google-chrome-stable --version
      # Restore-only: the cacheci workflow owns cache saves. Seeds the
      # BuildKit cache mounts so the in-test image build is incremental.
      - name: restore
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/cacheci
          key: tests-primary
          restore-keys: |
            tests-secondary
      - name: inject
        if: steps.restore.outputs.cache-matched-key != ''
        run: |
          cat > "$RUNNER_TEMP/inject.Dockerfile" <<'EOF'
          FROM busybox:1.37
          RUN --mount=type=cache,target=/root/.cache/go-build \
              --mount=type=cache,target=/go/pkg/mod \
              --mount=type=cache,target=/pnpm/store \
              --mount=type=bind,target=/restored \
              tar -xf /restored/go-build.tar -C /root/.cache/go-build && \
              tar -xf /restored/go-mod.tar -C /go/pkg/mod && \
              tar -xf /restored/pnpm-store.tar -C /pnpm/store
          EOF
          docker build -f "$RUNNER_TEMP/inject.Dockerfile" "$RUNNER_TEMP/cacheci"
      - name: run
        run: |
          cd tests && \
            uv run pytest \
            --basetemp=./tmp/ \
            integration/tests/${{matrix.suite}} \
            --sqlstore-provider ${{matrix.sqlstore-provider}} \
            --sqlite-mode ${{matrix.sqlite-mode}} \
            --postgres-version ${{matrix.postgres-version}} \
            --clickhouse-version ${{matrix.clickhouse-version}} \
            --schema-migrator-version ${{matrix.schema-migrator-version}}
