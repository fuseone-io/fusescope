version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /scripts/promqltestcorpus
    schedule:
      interval: weekly
    open-pull-requests-limit: 8
    commit-message:
      prefix: build
      include: scope
    # A dependency joins the first group that matches it.
    groups:
      gomod-otel:
        patterns:
          - go.opentelemetry.io/*
          - github.com/open-telemetry/*
        update-types:
          - minor
          - patch
      gomod-prometheus:
        patterns:
          - github.com/prometheus/*
          - github.com/prometheus-community/*
        update-types:
          - minor
          - patch
      gomod-storage:
        patterns:
          - github.com/ClickHouse/*
          - github.com/uptrace/bun*
          - github.com/jackc/*
          - modernc.org/sqlite
        update-types:
          - minor
          - patch
      gomod-openfga:
        patterns:
          - github.com/openfga/*
        update-types:
          - minor
          - patch
      gomod-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # v0.2 adds dashboard fields to adopt (#295); v0.3 also requires Go 1.27.
      - dependency-name: github.com/perses/spec
        versions:
          - ">= 0.2.0"
      # v1.40+ renders case-insensitive filters as ILIKE (#294).
      - dependency-name: github.com/huandu/go-sqlbuilder
        versions:
          - ">= 1.40.0"
      # v2.50 breaks the logs field-keys query (#291).
      - dependency-name: github.com/ClickHouse/clickhouse-go/v2
        versions:
          - ">= 2.48.0"
      # The log pipeline simulator stays on the versions fusescope-collector
      # builds with (its builder-config.yaml: core v0.164.0, stable v1.70.0,
      # contrib v0.164.1), bumped together with a collector release and checked
      # by the simulatorcontract integration suite.
      - dependency-name: go.opentelemetry.io/collector*
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: github.com/open-telemetry/opentelemetry-collector-contrib/*
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      # The preview runs the collector's log pipelines library at the version of
      # the collector the chart pins (collector ADR 0012), so it moves with
      # that pin, and make logspipeline-compat checks it.
      - dependency-name: github.com/fuseone-io/fusescope-collector-server/components/pkg/logspipeline
      # Needs the alertmanager v0.34 migration (#290).
      - dependency-name: github.com/prometheus/alertmanager
        versions:
          - ">= 0.32.0"
      - dependency-name: github.com/prometheus/prometheus
        versions:
          - ">= 0.312.0"

  - package-ecosystem: npm
    directories:
      - /frontend
      - /tests/e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: uv
    directory: /tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      uv-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directories:
      - /cmd/community
      - /tests
      - /deploy/demo/rum-sample
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      docker-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Go and Node version moves update go.mod, pins and docs together, by hand.
      - dependency-name: golang
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: node
        update-types:
          - version-update:semver-major
      - dependency-name: python
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
