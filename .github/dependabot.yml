version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /scripts/promqltestcorpus
    schedule:
      interval: weekly
    open-pull-requests-limit: 8
    commit-message:
      prefix: build
      include: scope
    # A dependency joins the first group that matches it.
    groups:
      gomod-otel:
        patterns:
          - go.opentelemetry.io/*
          - github.com/open-telemetry/*
        update-types:
          - minor
          - patch
      gomod-prometheus:
        patterns:
          - github.com/prometheus/*
          - github.com/prometheus-community/*
        update-types:
          - minor
          - patch
      gomod-storage:
        patterns:
          - github.com/ClickHouse/*
          - github.com/uptrace/bun*
          - github.com/jackc/*
          - modernc.org/sqlite
        update-types:
          - minor
          - patch
      gomod-openfga:
        patterns:
          - github.com/openfga/*
        update-types:
          - minor
          - patch
      gomod-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directories:
      - /frontend
      - /tests/e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: uv
    directory: /tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      uv-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directories:
      - /cmd/community
      - /tests
      - /deploy/demo/rum-sample
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      docker-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Go and Node version moves update go.mod, pins and docs together, by hand.
      - dependency-name: golang
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: node
        update-types:
          - version-update:semver-major
      - dependency-name: python
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
